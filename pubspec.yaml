name: jejaksehat_mobile
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.5.0
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Pindahkan ke dev_dependencies karena ini hanya alat bantu saat membuat aplikasi
  flutter_launcher_icons: ^0.13.1 

# --- KONFIGURASI IKON MENTOK KIRI DI SINI ---
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/Logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
     - assets/images/Logo.png
